<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Page introuvable – FormaPrompt</title>
    <style>
      :root { color-scheme: light; font-family: Arial, sans-serif; color: #102a2e; background: #f6faf8; }
      body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 1.5rem; box-sizing: border-box; }
      main { width: min(680px, 100%); padding: clamp(2rem, 6vw, 4rem); background: #fff; border: 1px solid #d8e5df; border-radius: 20px; text-align: center; box-shadow: 0 18px 50px rgba(16, 42, 46, .08); }
      p:first-child { color: #047857; font-weight: 700; }
      h1 { font-size: clamp(2rem, 7vw, 3.5rem); margin: .5rem 0 1rem; }
      p { line-height: 1.6; }
      nav { display: flex; flex-wrap: wrap; justify-content: center; gap: .75rem; margin-top: 2rem; }
      a { display: inline-block; padding: .8rem 1.1rem; border-radius: 10px; font-weight: 700; text-decoration: none; }
      a:first-child { color: #fff; background: #047857; }
      a:last-child { color: #047857; border: 1px solid #047857; }
      a:focus-visible { outline: 3px solid #f59e0b; outline-offset: 3px; }
    </style>
  </head>
  <body>
    <main>
      <p>Erreur 404</p>
      <h1>Cette page est introuvable</h1>
      <p>Vérifiez l’adresse ou revenez vers une ressource publique de FormaPrompt.</p>
      <nav aria-label="Pages utiles">
        <a href="/">Retour à l’accueil</a>
        <a href="/studio/">Découvrir le Studio</a>
      </nav>
    </main>
  </body>
</html>
