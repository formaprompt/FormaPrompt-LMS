name: Sprint 3 pgTAP temporaire

on:
  push:
    branches:
      - feat/sprint-3-commercial-cycle

permissions:
  contents: read

concurrency:
  group: sprint-3-pgtap-temporary
  cancel-in-progress: false

jobs:
  commercial-cycle:
    name: Socle v0.7 et cycle commercial
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Récupérer le commit Sprint 3
        uses: actions/checkout@v4

      - name: Installer Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.115.0

      - name: Reconstituer le schéma initial suivi dans le dépôt
        working-directory: webapp
        run: cat supabase_schema.sql ../.github/fixtures/v0_7_missing_baseline.sql > supabase/migrations/00000000000000_bootstrap_schema.sql

      - name: Démarrer PostgreSQL Supabase local et appliquer les migrations
        working-directory: webapp
        run: supabase db start

      - name: Vérifier la migration Sprint 3 dans le socle local
        working-directory: webapp
        run: |
          supabase migration list --local
          test -f supabase/migrations/20260821144632_sprint_3_commercial_cycle.sql

      - name: Exécuter pgTAP Sprint 3 et invariants de droits
        working-directory: webapp
        run: |
          supabase test db \
            supabase/tests/commercial_cycle.sql \
            supabase/tests/commercial_checkout_contexts.sql \
            supabase/tests/commercial_consents.sql \
            supabase/tests/positioning_course_access.sql \
            supabase/tests/prompt_learning_path_access.sql \
            supabase/tests/access_incidents_audit.sql

      - name: Arrêter l'environnement local
        if: always()
        working-directory: webapp
        run: supabase stop --no-backup
