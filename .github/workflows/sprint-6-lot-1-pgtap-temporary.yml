name: Sprint 6 Lot 1 pgTAP validation

on:
  push:
    branches:
      - codex/sprint-6-lot-1-data-security
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sprint-6-lot-1-pgtap-temporary
  cancel-in-progress: false

jobs:
  data-contract:
    name: PostgreSQL, RLS, RPC and projections
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: webapp

    steps:
      - name: Checkout Sprint 6 Lot 1
        uses: actions/checkout@v4

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.115.0

      - name: Start clean local Supabase
        shell: bash
        run: |
          set -euo pipefail
          mv supabase/migrations /tmp/formaprompt-migrations
          mkdir supabase/migrations
          supabase start
          psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" \
            -v ON_ERROR_STOP=1 \
            -f supabase_schema.sql
          psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" \
            -v ON_ERROR_STOP=1 <<'SQL'
          -- Socle historique anterieur aux migrations suivies dans le depot.
          CREATE TABLE public.calendar_bookings (
            id uuid PRIMARY KEY DEFAULT gen_random_uuid(),
            date date NOT NULL,
            slot text NOT NULL,
            type text NOT NULL DEFAULT 'option',
            of_name text NOT NULL,
            comments text,
            created_at timestamptz NOT NULL DEFAULT timezone('utc', now()),
            updated_at timestamptz NOT NULL DEFAULT timezone('utc', now())
          );
          ALTER TABLE public.calendar_bookings ENABLE ROW LEVEL SECURITY;
          INSERT INTO storage.buckets (id, name, public)
          VALUES ('blog-images', 'blog-images', true)
          ON CONFLICT (id) DO NOTHING;
          SQL
          rmdir supabase/migrations
          mv /tmp/formaprompt-migrations supabase/migrations

      - name: Apply all committed migrations locally
        run: supabase migration up --local --include-all

      - name: Verify Sprint 6 Lot 1 migration is applied
        shell: bash
        run: |
          set -euo pipefail
          supabase migration list --local
          test -f supabase/migrations/20260822160000_sprint_6_lot_1_data_contract.sql

      - name: Run Sprint 6 Lot 1 pgTAP dynamically
        run: supabase test db --local supabase/tests/sprint_6_lot_1_data_security.sql

      - name: Run Sprint 6 Lot 1 structural Node tests
        run: node --test supabase/functions/_tests/sprint6Lot1DataContract.test.js

      - name: Stop local Supabase
        if: always()
        run: supabase stop --no-backup
