name: Sprint 5 local validation

on:
  push:
    branches:
      - codex/sprint-5-stripe-post-payment
  workflow_dispatch:

permissions:
  contents: read

jobs:
  postgres-and-deno:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: webapp

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.115.0

      - name: Install Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Start clean local Supabase
        shell: bash
        run: |
          set -euo pipefail
          mv supabase/migrations /tmp/formaprompt-migrations
          mkdir supabase/migrations
          supabase start
          psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" \
            -v ON_ERROR_STOP=1 \
            -f supabase_schema.sql
          psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" \
            -v ON_ERROR_STOP=1 <<'SQL'
          -- Table historique créée avant la mise en place des migrations du dépôt.
          CREATE TABLE public.calendar_bookings (
            id uuid PRIMARY KEY DEFAULT gen_random_uuid(),
            date date NOT NULL,
            slot text NOT NULL,
            type text NOT NULL DEFAULT 'option',
            of_name text NOT NULL,
            comments text,
            created_at timestamptz NOT NULL DEFAULT timezone('utc', now()),
            updated_at timestamptz NOT NULL DEFAULT timezone('utc', now())
          );
          ALTER TABLE public.calendar_bookings ENABLE ROW LEVEL SECURITY;
          SQL
          rmdir supabase/migrations
          mv /tmp/formaprompt-migrations supabase/migrations

      - name: Apply committed migrations
        run: supabase migration up --local --include-all

      - name: Run all pgTAP suites
        run: supabase test db --local supabase/tests

      - name: Check every Edge Function
        shell: bash
        run: |
          set -euo pipefail
          find supabase/functions -name index.ts -print0 \
            | xargs -0 deno check --node-modules-dir=auto
